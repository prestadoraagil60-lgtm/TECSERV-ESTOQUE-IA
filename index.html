<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TECSERV - Estoque IA</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header span {
      color: #16a34a;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    button {
      background: #16a34a;
      color: white;
      border: 0;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<header>
  <h1>TEC<span>SERV</span></h1>
  <p>Estoque IA</p>
</header>

<div class="container">

  <div class="card">
    <h2>📦 Sistema de Estoque</h2>
    <p>Bem-vindo ao sistema TECSERV Estoque IA.</p>
    <button onclick="alert('Sistema funcionando!')">
      Entrar no sistema
    </button>
  </div>

  <div class="card">
    <h2>🤖 Inteligência Artificial</h2>
    <p>Controle de produtos, estoque e movimentações.</p>
  </div>

</div>

</body>
</html>
