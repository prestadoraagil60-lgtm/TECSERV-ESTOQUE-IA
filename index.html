<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TECSERV ESTOQUE IA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#07110a;
color:white
}

header{
background:#0b0b0b;
padding:18px;
border-bottom:1px solid #1c4024
}

.logo{
font-size:25px;
font-weight:bold
}

.logo span{
color:#39e75f
}

.container{
max-width:1100px;
margin:auto;
padding:25px
}

.login{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}

.login-box{
width:100%;
max-width:420px;
background:#0e1d13;
border:1px solid #1d4427;
border-radius:16px;
padding:30px;
box-shadow:0 10px 40px #0008
}

.login-box h1{
margin-top:0;
text-align:center
}

.login-logo{
text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:25px
}

.login-logo span{
color:#39e75f
}

input{
background:#08120b;
color:white;
border:1px solid #285533;
padding:12px;
border-radius:8px;
width:100%;
margin:6px 0 14px
}

label{
font-size:14px;
color:#b7c5ba
}

button{
background:#39e75f;
border:0;
padding:12px 18px;
border-radius:8px;
font-weight:bold;
cursor:pointer
}

button:hover{
opacity:.85
}

.btn{
width:100%;
margin-top:8px
}

.btn-secundario{
background:#18351f;
color:white;
border:1px solid #285533
}

.mensagem{
margin-top:15px;
text-align:center;
font-size:14px
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin:20px 0
}

.card,.panel{
background:#0e1d13;
border:1px solid #1d4427;
border-radius:14px;
padding:20px
}

.panel{
margin-top:20px
}

.card small{
color:#9aaa9e
}

.number{
font-size:30px;
font-weight:bold;
color:#39e75f;
margin-top:8px
}

.topo{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
flex-wrap:wrap
}

.usuario{
color:#9aaa9e
}

.form{
display:grid;
grid-template-columns:2fr 1fr 1fr 1fr auto;
gap:8px;
align-items:end
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px
}

th,td{
padding:12px;
border-bottom:1px solid #1d3823;
text-align:left
}

th{
color:#8fa996
}

.status{
color:#39e75f
}

.baixo{
color:#ff6b61
}

#mensagemEstoque{
margin-top:10px;
font-weight:bold
}

.oculto{
display:none!important
}

@media(max-width:800px){

.cards{
grid-template-columns:repeat(2,1fr)
}

.form{
grid-template-columns:1fr
}

}

@media(max-width:500px){

.cards{
grid-template-columns:1fr
}

.container{
padding:15px
}

table{
font-size:13px
}

.topo{
align-items:flex-start
}

}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="telaLogin" class="login">

<div class="login-box">

<div class="login-logo">
TEC<span>SERV</span>
</div>

<h1 id="tituloLogin">Entrar</h1>

<div id="campoNome" class="oculto">

<label>Nome</label>

<input
id="nomeCadastro"
type="text"
placeholder="Seu nome">

</div>

<label>E-mail</label>

<input
id="email"
type="email"
placeholder="seu@email.com">

<label>Senha</label>

<input
id="senha"
type="password"
placeholder="Sua senha">

<button
id="botaoLogin"
class="btn"
onclick="entrar()">

Entrar

</button>

<button
id="botaoCadastro"
class="btn btn-secundario"
onclick="alternarCadastro()">

Criar conta

</button>

class="mens
